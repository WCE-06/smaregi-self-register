<!doctype html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aozora kitchen メニュー編集</title>
  <style>
    :root{--green:#245a42;--deep:#173d2d;--cream:#f4efe4;--paper:#fffdf8;--line:#ded7ca;--muted:#687169;--accent:#d99a31;--danger:#a43d30}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:#203027;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.page{min-height:100vh}.top{position:sticky;top:0;z-index:10;background:#f4efe4ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.top-inner{max-width:1280px;margin:auto;padding:15px 20px;display:flex;align-items:center;gap:14px}.logo{width:46px;height:46px;border-radius:14px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:23px;font-weight:900}.title{flex:1}.title h1{font-size:22px;margin:0}.title small{color:var(--muted);font-weight:800}.button{border:0;border-radius:12px;min-height:46px;padding:11px 16px;background:var(--green);color:white;font:inherit;font-weight:900;cursor:pointer}.button.secondary{background:#fff;color:var(--green);border:1px solid var(--line)}.button.danger{background:#fff0ed;color:var(--danger);border:1px solid #e6b7ae}.button:disabled{opacity:.5;cursor:not-allowed}.wrap{max-width:1280px;margin:auto;padding:20px}.toolbar{display:grid;grid-template-columns:minmax(240px,1fr) auto auto;gap:10px;align-items:center}.search{width:100%;height:50px;border:1px solid var(--line);border-radius:13px;padding:0 16px;font:inherit;font-size:17px;background:#fff}.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 0 10px;scrollbar-width:thin}.tab{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:99px;padding:10px 16px;color:var(--deep);font-weight:900;cursor:pointer}.tab.active{background:#dfeee4;border-color:var(--green)}.notice{min-height:28px;color:var(--muted);font-weight:700}.notice.error{color:var(--danger)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:15px;margin-top:12px}.product,.add-card{min-height:330px;border:1px solid var(--line);border-radius:18px;background:#fff;overflow:hidden;box-shadow:0 8px 20px #243c2d0d}.product{cursor:grab}.product.dragging{opacity:.35}.product.drop-before{box-shadow:-7px 0 0 var(--accent)}.product.drop-after{box-shadow:7px 0 0 var(--accent)}.photo{height:165px;background:#eee9df;display:grid;place-items:center;overflow:hidden;position:relative}.photo img{width:100%;height:100%;object-fit:cover}.photo .fallback{font-size:56px}.drag-hint{position:absolute;top:10px;right:10px;background:#fffddd;border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:12px;font-weight:900}.body{padding:14px}.body h3{font-size:17px;line-height:1.4;margin:0 0 5px}.code{color:var(--muted);font-size:12px}.price{font-size:19px;font-weight:900;margin:12px 0}.badges{display:flex;gap:5px;flex-wrap:wrap;min-height:25px}.badge{padding:4px 7px;border-radius:7px;background:#eef3ee;color:var(--green);font-size:11px;font-weight:900}.card-actions{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:13px}.card-actions .button{min-height:42px;padding:8px}.add-card{display:grid;place-items:center;border:2px dashed #abc0b2;color:var(--green);cursor:pointer;text-align:center;padding:20px}.add-card b{display:block;font-size:46px;line-height:1}.add-card span{font-size:17px;font-weight:900}.empty{grid-column:1/-1;background:#fff;border:1px solid var(--line);border-radius:18px;padding:50px;text-align:center;color:var(--muted)}
    dialog{width:min(760px,calc(100% - 24px));max-height:90vh;border:0;border-radius:20px;padding:0;background:var(--paper);box-shadow:0 30px 80px #0004}dialog::backdrop{background:#13251a99}.modal-head{position:sticky;top:0;z-index:2;background:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:21px}.close{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:22px;cursor:pointer}.modal-body{padding:20px;overflow:auto}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:block;color:var(--muted);font-size:13px;font-weight:900}.field.wide{grid-column:1/-1}.field input,.field select,.field textarea{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;background:#fff;color:var(--deep)}.field textarea{min-height:85px;resize:vertical}.checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.check{display:flex;align-items:center;gap:6px;background:#f6f3ec;border:1px solid var(--line);border-radius:9px;padding:8px 10px}.check input{width:auto;margin:0}.options-head{display:flex;justify-content:space-between;align-items:center;margin-top:22px}.option-group{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;background:#faf8f3}.option-top{display:grid;grid-template-columns:1fr 130px auto auto;gap:8px;align-items:center}.option-top input,.option-top select,.choice input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;font:inherit;background:#fff}.choice{display:grid;grid-template-columns:1fr 130px auto;gap:8px;margin-top:8px}.mini{border:1px solid var(--line);background:#fff;color:var(--green);border-radius:9px;padding:8px 10px;font-weight:900;cursor:pointer}.mini.remove{color:var(--danger)}.modal-actions{position:sticky;bottom:0;background:var(--paper);display:flex;justify-content:flex-end;gap:10px;padding:15px 20px;border-top:1px solid var(--line)}.picker-search{width:100%;height:48px;border:1px solid var(--line);border-radius:11px;padding:0 14px;font:inherit}.picker-list{display:grid;gap:8px;margin-top:13px}.picker-row{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:12px;background:#fff}.picker-row img{width:58px;height:58px;object-fit:cover;border-radius:9px;background:#eee}.picker-row strong,.picker-row small{display:block}.picker-row small{color:var(--muted)}
    @media(max-width:700px){.top-inner{align-items:flex-start;flex-wrap:wrap}.title{min-width:200px}.toolbar{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.field.wide{grid-column:auto}.option-top{grid-template-columns:1fr 1fr}.choice{grid-template-columns:1fr 100px auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.product,.add-card{min-height:280px}.photo{height:125px}.body{padding:11px}.body h3{font-size:15px}}
  </style>
</head>
<body><div class="page">
  <header class="top"><div class="top-inner"><div class="logo">お</div><div class="title"><small>従業員用</small><h1>Aozora kitchen メニュー編集</h1></div><button class="button secondary" id="backButton">管理トップへ戻る</button><button class="button" id="saveOrder" disabled>並び順を保存</button></div></header>
  <main class="wrap"><div class="toolbar"><input class="search" id="search" type="search" placeholder="商品名・商品コードで検索"><button class="button secondary" id="reload">再読み込み</button><span id="count"></span></div><nav class="tabs" id="tabs"></nav><div class="notice" id="notice">商品情報を読み込んでいます。</div><section class="grid" id="grid"></section></main>
</div>

<dialog id="editDialog"><div class="modal-head"><h2 id="editTitle">商品設定</h2><button class="close" data-close="editDialog">×</button></div><div class="modal-body"><div class="fields">
  <label class="field">商品コード<input id="editCode" readonly></label><label class="field">スマレジ商品名<input id="editName" readonly></label>
  <label class="field">表示カテゴリー<select id="editCategory"></select></label><label class="field">表示順<input id="editOrder" type="number" min="0" max="999999"></label>
  <label class="field wide">画像URL<input id="editImage" placeholder="画像URLを入力"></label><label class="field wide">商品説明<textarea id="editDescription"></textarea></label>
  <div class="field wide">表示設定<div class="checks"><label class="check"><input id="editAvailable" type="checkbox">販売中</label><label class="check"><input class="editFlag" type="checkbox" value="recommended">おすすめ</label><label class="check"><input class="editFlag" type="checkbox" value="new">新商品</label><label class="check"><input class="editFlag" type="checkbox" value="limited">期間限定</label><label class="check"><input class="editFlag" type="checkbox" value="popular">人気</label><label class="check"><input class="editFlag" type="checkbox" value="spicy">辛い</label></div></div>
  </div><div class="options-head"><div><h3>カスタマイズ・オプション</h3><small>サイズ、ご飯の量、ねぎの有無などを設定できます。</small></div><button class="mini" id="addGroup">＋ 選択項目</button></div><div id="optionGroups"></div></div><div class="modal-actions"><button class="button secondary" data-close="editDialog">閉じる</button><button class="button" id="saveProduct">商品設定を保存</button></div></dialog>

<dialog id="pickerDialog"><div class="modal-head"><h2>メニューへ商品を追加</h2><button class="close" data-close="pickerDialog">×</button></div><div class="modal-body"><input class="picker-search" id="pickerSearch" type="search" placeholder="商品名・商品コードで検索"><div class="picker-list" id="pickerList"></div></div></dialog>

<script>
const ADMIN_TOKEN=<?!= JSON.stringify(adminToken) ?>;
const CATEGORIES=[['food-tsukemen','つけ麺'],['food-udon','うどん・ほうとう'],['food-pasta','パスタ'],['food-don','ご飯もの'],['food-side','サイドメニュー'],['soft-cafe','カフェ'],['soft-simple','ソフトドリンク'],['soft-mocktail','モクテル'],['alcohol-main','定番アルコール'],['alcohol-cocktail','カクテル'],['dessert','デザート']];
const byId=id=>document.getElementById(id);const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let products=[],category=CATEGORIES[0][0],editing=null,dirty=false,dragCode='';
function call(name,...args){return new Promise((resolve,reject)=>{const r=google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e&&e.message||e)));r[name](...args,ADMIN_TOKEN)})}
function categoryName(value){return (CATEGORIES.find(x=>x[0]===value)||[])[1]||'未分類'}
function productCategory(p){const explicit=String(p&&p.menuCategory||'');if(CATEGORIES.some(x=>x[0]===explicit))return explicit;const name=String(p&&p.name||'');if(/モクテル|ノンアル/.test(name))return'soft-mocktail';if(/コーヒーゼリー|かき氷|アイスクリーム|ソフトクリーム|ジェラート|ケーキ|パフェ|プリン|ゼリー|クレープ|スイーツ/.test(name))return'dessert';if(/コーヒー|ココア|いちごミルク|ミルクティー|カフェラテ|ラテ|紅茶/.test(name))return'soft-cafe';if(/カクテル|レゲエパンチ|モスコミュール|カシス|ファジーネーブル/.test(name))return'alcohol-cocktail';if(/ビール|焼酎|泡盛|梅酒|日本酒|ワイン|ウイスキー|ハイボール|サワー|酎ハイ|テキーラ/.test(name))return'alcohol-main';if(/ジュース|ソフトドリンク|ソーダ|コーラ|ラムネ|カルピス|ウーロン茶|緑茶|オレンジ|アップル/.test(name))return'soft-simple';if(/つけ麺/.test(name))return'food-tsukemen';if(/うどん|ほうとう/.test(name))return'food-udon';if(/パスタ|スパゲッティ/.test(name))return'food-pasta';if(/丼|ご飯|ライス/.test(name))return'food-don';return'food-side'}
function init(){byId('editCategory').innerHTML=CATEGORIES.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');byId('tabs').innerHTML=CATEGORIES.map(x=>`<button class="tab" data-category="${x[0]}">${x[1]}</button>`).join('');byId('tabs').addEventListener('click',e=>{const tab=e.target.closest('.tab');if(tab){category=tab.dataset.category;byId('search').value='';render()}});load()}
async function load(){setNotice('商品情報を読み込んでいます。');try{const result=await call('getMenuManagementData');products=result.products||[];dirty=false;byId('saveOrder').disabled=true;render();setNotice('カードをドラッグすると表示順を変更できます。')}catch(e){setNotice('読込エラー: '+e.message,true)}}
function visible(){const q=byId('search').value.trim().toLowerCase();return products.filter(p=>p.section==='kitchen'&&productCategory(p)===category&&(!q||(p.name+' '+p.code).toLowerCase().includes(q))).sort((a,b)=>Number(a.displaySequence||0)-Number(b.displaySequence||0)||String(a.name).localeCompare(String(b.name),'ja'))}
function render(){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.category===category));const list=visible(),filtered=!!byId('search').value.trim();byId('count').textContent=list.length+'商品';byId('grid').innerHTML=`<button class="add-card" id="addProduct"><div><b>＋</b><span>${categoryName(category)}へ商品を追加</span></div></button>`+(list.length?list.map(p=>card(p,!filtered)).join(''):`<div class="empty">${filtered?'検索条件に一致する商品はありません。':'このカテゴリーにはまだ商品がありません。'}</div>`);byId('addProduct').onclick=openPicker;bindCards()}
function card(p,draggable){const flags=(p.flags||[]).map(f=>`<span class="badge">${({recommended:'おすすめ',new:'新商品',limited:'期間限定',popular:'人気',spicy:'辛い'}[f]||f)}</span>`).join('');const image=p.imageUrl?`<img src="${esc(p.imageUrl)}" alt="" onerror="this.remove()">`:'<span class="fallback">🍽️</span>';return `<article class="product" data-code="${esc(p.code)}" draggable="${draggable}"><div class="photo">${image}${draggable?'<span class="drag-hint">↕ 並べ替え</span>':''}</div><div class="body"><h3>${esc(p.name)}</h3><div class="code">${esc(p.code)}</div><div class="price">税込 ¥${Number(p.price||0).toLocaleString()}</div><div class="badges">${flags}</div><div class="card-actions"><button class="button edit">設定・オプション</button><button class="button danger remove">外す</button></div></div></article>`}
function bindCards(){byId('grid').querySelectorAll('.product').forEach(el=>{el.querySelector('.edit').onclick=()=>openEdit(el.dataset.code);el.querySelector('.remove').onclick=()=>removeProduct(el.dataset.code);el.addEventListener('dragstart',()=>{dragCode=el.dataset.code;el.classList.add('dragging')});el.addEventListener('dragend',()=>{dragCode='';el.classList.remove('dragging');document.querySelectorAll('.product').forEach(x=>x.classList.remove('drop-before','drop-after'))});el.addEventListener('dragover',e=>{if(!dragCode||dragCode===el.dataset.code)return;e.preventDefault();const after=e.clientX>el.getBoundingClientRect().left+el.offsetWidth/2;el.classList.toggle('drop-after',after);el.classList.toggle('drop-before',!after)});el.addEventListener('dragleave',()=>el.classList.remove('drop-before','drop-after'));el.addEventListener('drop',e=>{e.preventDefault();const after=el.classList.contains('drop-after');moveProduct(dragCode,el.dataset.code,after)})})}
function moveProduct(from,to,after){const ordered=visible(),a=ordered.findIndex(p=>p.code===from),b=ordered.findIndex(p=>p.code===to);if(a<0||b<0)return;const [moved]=ordered.splice(a,1);let target=ordered.findIndex(p=>p.code===to)+(after?1:0);ordered.splice(target,0,moved);ordered.forEach((p,i)=>p.displaySequence=(i+1)*10);dirty=true;byId('saveOrder').disabled=false;render();setNotice('並び順を変更しました。「並び順を保存」を押してください。')}
async function saveOrder(){if(!dirty)return;const entries=visible().map((p,i)=>({productCode:p.code,menuCategory:category,displayOrder:(i+1)*10}));try{byId('saveOrder').disabled=true;setNotice('並び順を保存しています。');await call('saveMenuLayout',entries);dirty=false;setNotice('並び順を保存しました。');await load()}catch(e){byId('saveOrder').disabled=false;setNotice('保存エラー: '+e.message,true)}}
function openPicker(){byId('pickerSearch').value='';renderPicker();byId('pickerDialog').showModal();setTimeout(()=>byId('pickerSearch').focus(),50)}
function pickerProducts(){const q=byId('pickerSearch').value.trim().toLowerCase();return products.filter(p=>p.section!=='kitchen'&&(!q||(p.name+' '+p.code).toLowerCase().includes(q))).slice(0,80)}
function renderPicker(){const list=pickerProducts();byId('pickerList').innerHTML=list.length?list.map(p=>`<div class="picker-row"><div>${p.imageUrl?`<img src="${esc(p.imageUrl)}" alt="">`:'🍽️'}</div><div><strong>${esc(p.name)}</strong><small>${esc(p.code)}・税込 ¥${Number(p.price||0).toLocaleString()}</small></div><button class="button add" data-code="${esc(p.code)}">追加</button></div>`).join(''):'<div class="empty">商品が見つかりません。</div>';byId('pickerList').querySelectorAll('.add').forEach(b=>b.onclick=()=>addProduct(b.dataset.code,b))}
async function addProduct(code,button){const p=products.find(x=>x.code===code);if(!p)return;const tail=visible().reduce((m,x)=>Math.max(m,Number(x.displaySequence||0)),0)+10;try{button.disabled=true;await call('saveMenuProductConfig',{productCode:p.code,section:'kitchen',menuCategory:category,displayOrder:tail,flags:p.flags||[],imageUrl:p.imageUrl||'',description:p.description||'',optionGroups:p.optionGroups||[],available:true});byId('pickerDialog').close();await load();setNotice(p.name+'を追加しました。')}catch(e){button.disabled=false;setNotice('追加エラー: '+e.message,true)}}
async function removeProduct(code){const p=products.find(x=>x.code===code);if(!p||!confirm(p.name+'をAozora kitchenメニューから外しますか？'))return;try{await call('saveMenuProductConfig',{productCode:p.code,section:'shop',menuCategory:'',displayOrder:'',flags:p.flags||[],imageUrl:p.imageUrl||'',description:p.description||'',optionGroups:p.optionGroups||[],available:p.available!==false});await load();setNotice(p.name+'をメニューから外しました。')}catch(e){setNotice('変更エラー: '+e.message,true)}}
function openEdit(code){editing=products.find(x=>x.code===code);if(!editing)return;byId('editTitle').textContent=editing.name+'の設定';byId('editCode').value=editing.code;byId('editName').value=editing.name;byId('editCategory').value=productCategory(editing);byId('editOrder').value=editing.displaySequence||'';byId('editImage').value=editing.imageUrl||'';byId('editDescription').value=editing.description||'';byId('editAvailable').checked=editing.available!==false;document.querySelectorAll('.editFlag').forEach(x=>x.checked=(editing.flags||[]).includes(x.value));renderGroups(editing.optionGroups||[]);byId('editDialog').showModal()}
function renderGroups(groups){byId('optionGroups').innerHTML=groups.map((g,gi)=>`<div class="option-group" data-index="${gi}"><div class="option-top"><input class="group-name" value="${esc(g.name)}" placeholder="例：サイズ"><select class="group-type"><option value="single" ${g.type!=='multiple'?'selected':''}>1つ選択</option><option value="multiple" ${g.type==='multiple'?'selected':''}>複数選択</option></select><label class="check"><input class="group-required" type="checkbox" ${g.required!==false?'checked':''}>必須</label><button class="mini remove remove-group">削除</button></div><div class="choices">${(g.choices||[]).map(c=>choiceRow(c)).join('')}</div><button class="mini add-choice">＋ 選択肢を追加</button></div>`).join('');bindGroups()}
function choiceRow(c={}){return `<div class="choice"><input class="choice-name" value="${esc(c.name||'')}" placeholder="選択肢名"><input class="choice-price" type="number" min="0" max="99999" value="${Number(c.priceDelta||0)}" placeholder="追加料金"><button class="mini remove remove-choice">削除</button></div>`}
function bindGroups(){document.querySelectorAll('.remove-group').forEach(b=>b.onclick=()=>b.closest('.option-group').remove());document.querySelectorAll('.remove-choice').forEach(b=>b.onclick=()=>b.closest('.choice').remove());document.querySelectorAll('.add-choice').forEach(b=>b.onclick=()=>{b.previousElementSibling.insertAdjacentHTML('beforeend',choiceRow());bindGroups()})}
function readGroups(){return [...document.querySelectorAll('.option-group')].map((g,gi)=>({id:'group_'+gi,name:g.querySelector('.group-name').value.trim(),type:g.querySelector('.group-type').value,required:g.querySelector('.group-required').checked,choices:[...g.querySelectorAll('.choice')].map((c,ci)=>({id:'choice_'+ci,name:c.querySelector('.choice-name').value.trim(),priceDelta:Number(c.querySelector('.choice-price').value||0)}))})).filter(g=>g.name||g.choices.length)}
async function saveProduct(){if(!editing)return;const button=byId('saveProduct');try{button.disabled=true;await call('saveMenuProductConfig',{productCode:editing.code,section:'kitchen',menuCategory:byId('editCategory').value,displayOrder:byId('editOrder').value,flags:[...document.querySelectorAll('.editFlag:checked')].map(x=>x.value),imageUrl:byId('editImage').value.trim(),description:byId('editDescription').value.trim(),optionGroups:readGroups(),available:byId('editAvailable').checked});category=byId('editCategory').value;byId('editDialog').close();await load();setNotice(editing.name+'の設定を保存しました。')}catch(e){setNotice('保存エラー: '+e.message,true)}finally{button.disabled=false}}
function setNotice(text,error=false){byId('notice').textContent=text;byId('notice').classList.toggle('error',error)}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>byId(b.dataset.close).close());byId('search').addEventListener('input',render);byId('pickerSearch').addEventListener('input',renderPicker);byId('reload').onclick=load;byId('saveOrder').onclick=saveOrder;byId('saveProduct').onclick=saveProduct;byId('addGroup').onclick=()=>{byId('optionGroups').insertAdjacentHTML('beforeend',`<div class="option-group"><div class="option-top"><input class="group-name" placeholder="例：サイズ"><select class="group-type"><option value="single">1つ選択</option><option value="multiple">複数選択</option></select><label class="check"><input class="group-required" type="checkbox" checked>必須</label><button class="mini remove remove-group">削除</button></div><div class="choices">${choiceRow()}</div><button class="mini add-choice">＋ 選択肢を追加</button></div>`);bindGroups()};byId('backButton').onclick=()=>location.href='?page=admin&adminToken='+encodeURIComponent(ADMIN_TOKEN);init();
</script></body></html>
