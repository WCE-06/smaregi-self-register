<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>セルフレジ速度シミュレーター</title>
<style>
:root{--green:#1f6548;--deep:#173d2d;--paper:#f5f0e5;--card:#fffdfa;--line:#ddd5c7;--muted:#687169;--accent:#e4f0e8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--deep);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh;display:flex;flex-direction:column}.top{height:76px;display:flex;align-items:center;justify-content:space-between;padding:14px 5vw}.brand{display:flex;align-items:center;gap:12px;font-size:23px;font-weight:900}.logo{width:48px;height:48px;border-radius:15px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:30px}.safe{border:1px solid #c7b16c;background:#fff6d9;border-radius:99px;padding:10px 15px;font-weight:800;color:#6b5615}.shell{width:min(1180px,94vw);min-height:680px;margin:0 auto 18px;background:var(--card);border-radius:28px;box-shadow:0 18px 50px #173d2d18;display:grid;grid-template-columns:minmax(0,1fr) 290px;overflow:hidden}.screen{padding:42px;display:flex;align-items:center;justify-content:center}.content{width:min(760px,100%)}.eyebrow{font-size:13px;font-weight:900;letter-spacing:.12em;color:var(--muted)}h1{font-size:38px;margin:10px 0}p{color:var(--muted);font-size:18px;line-height:1.7}.stack{display:grid;gap:13px;margin-top:24px}.button{min-height:66px;border:2px solid var(--line);border-radius:17px;background:#fff;color:var(--deep);font-size:19px;font-weight:900;padding:14px 20px;cursor:pointer}.button:hover{border-color:var(--green)}.primary{background:var(--green);border-color:var(--green);color:#fff}.services{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.service{min-height:180px}.service b{font-size:42px;display:block}.service small{display:block;margin-top:8px;color:var(--muted)}.input{width:100%;height:64px;border:2px solid var(--line);border-radius:15px;padding:0 18px;font-size:22px}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.product{text-align:left;min-height:145px}.product strong,.product span{display:block}.product span{margin-top:8px;color:var(--green);font-size:21px}.review{border:1px solid var(--line);border-radius:18px;padding:22px}.review-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.review-row:last-child{border:0}.total{font-size:30px;font-weight:900;text-align:right;margin-top:20px}.progress{height:14px;background:#e6e1d8;border-radius:99px;overflow:hidden;margin:24px 0}.bar{height:100%;width:10%;background:var(--green);transition:width .25s}.ad{min-height:180px;border-radius:22px;background:linear-gradient(135deg,#e4f0e8,#fff1ce);display:grid;place-items:center;text-align:center;padding:24px}.ad strong{font-size:27px}.spinner{width:68px;height:68px;border:8px solid #dbe9df;border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px}@keyframes spin{to{transform:rotate(360deg)}}.side{background:#f0ece3;border-left:1px solid var(--line);padding:24px 20px}.side h2{font-size:18px;margin:0 0 16px}.metric{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px}.metric small{display:block;color:var(--muted)}.metric strong{font-size:24px}.settings{display:grid;gap:12px;margin-top:22px}.settings label{font-size:12px;font-weight:800;color:var(--muted)}.settings input{width:100%}.timeline{font-size:12px;margin-top:20px;display:grid;gap:7px}.event{border-left:3px solid #9fb8a8;padding-left:9px}.event b{display:block}.pill{display:inline-block;padding:6px 10px;border-radius:99px;background:var(--accent);font-size:13px;font-weight:850}.hidden{display:none!important}@media(max-width:820px){.shell{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid var(--line)}.services,.products{grid-template-columns:1fr}.screen{padding:24px}h1{font-size:29px}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">お</div>セルフレジ</div><div class="safe">安全な速度確認モード・売上は立ちません</div></header><main class="shell"><section class="screen"><div class="content" id="view"></div></section><aside class="side"><h2>体感速度</h2><div class="metric"><small>開始からの経過</small><strong id="elapsed">0.0秒</strong></div><div class="metric"><small>画面上で待った時間</small><strong id="waited">0.0秒</strong></div><div class="metric"><small>商品登録の残り</small><strong id="remaining">0.0秒</strong></div><div class="settings"><label>会員確認 <span id="memberVal"></span><input id="memberDelay" type="range" min="200" max="3000" step="100" value="600"></label><label>商品1点の登録 <span id="itemVal"></span><input id="itemDelay" type="range" min="500" max="1800" step="50" value="1150"></label><label>決済端末起動 <span id="terminalVal"></span><input id="terminalDelay" type="range" min="1000" max="10000" step="500" value="3000"></label><label>売上確認 <span id="saleVal"></span><input id="saleDelay" type="range" min="1000" max="10000" step="500" value="3500"></label></div><div class="timeline" id="timeline"></div></aside></main></div>
<script>
const view=document.getElementById('view');const q=id=>document.getElementById(id);let started=0,waitStarted=0,totalWait=0,elapsedTimer=null,productReadyAt=0,cart=[],service='';
const products={shop:[['4901625421798','おもひでサイダー',180],['49431858','手づくりクッキー',250],['NBFRESH001','朝採れ野菜',300]],kitchen:[['kake_udon','かけうどん',500],['cheese_dog','チーズドッグ',500],['mocktail_peach','ピーチモクテル',650]]};
const val=id=>Number(q(id).value),sec=n=>(n/1000).toFixed(1)+'秒',yen=n=>'￥'+n.toLocaleString('ja-JP');
function updateLabels(){q('memberVal').textContent=sec(val('memberDelay'));q('itemVal').textContent=sec(val('itemDelay'));q('terminalVal').textContent=sec(val('terminalDelay'));q('saleVal').textContent=sec(val('saleDelay'))}document.querySelectorAll('input[type=range]').forEach(x=>x.addEventListener('input',updateLabels));updateLabels();
function log(label){const t=started?((performance.now()-started)/1000).toFixed(1):'0.0';q('timeline').insertAdjacentHTML('afterbegin',`<div class="event"><b>${label}</b>${t}秒</div>`)}
function startClock(){if(started)return;started=performance.now();elapsedTimer=setInterval(()=>{q('elapsed').textContent=((performance.now()-started)/1000).toFixed(1)+'秒';q('waited').textContent=(totalWait/1000).toFixed(1)+'秒';q('remaining').textContent=sec(Math.max(0,productReadyAt-performance.now()))},100)}
function setScreen(html){view.innerHTML=html;window.scrollTo(0,0)}function waitStart(){waitStarted=performance.now()}function waitEnd(){if(waitStarted){totalWait+=performance.now()-waitStarted;waitStarted=0}}
function member(){setScreen(`<span class="eyebrow">STEP 1</span><h1>いらっしゃいませ。</h1><p>お会計の最初に会員証をスキャンしてください。</p><div class="stack"><input class="input" id="member" value="650A0DB2F6" aria-label="会員コード"><button class="button primary" onclick="verify()">会員証を読み取る</button></div>`)}
async function verify(){startClock();waitStart();log('会員証を読み取り');setScreen(`<div class="spinner"></div><h1>会員証を確認しています</h1><div class="progress"><div class="bar" style="width:65%"></div></div>`);await sleep(val('memberDelay'));waitEnd();log('会員確認完了');services()}
function services(){setScreen(`<span class="eyebrow">STEP 2</span><h1>ご利用内容を選んでください</h1><div class="services"><button class="button service" onclick="choose('shop')"><b>🛍️</b>おもひで商店<small>バーコード商品・バーコードなし商品</small></button><button class="button service" onclick="choose('kitchen')"><b>🍴</b>Aozora kitchen<small>メニューとカスタマイズ</small></button><button class="button service" onclick="choose('studio')"><b>🎨</b>FEBBRAIO<small>スタジオ利用料金</small></button></div>`)}
async function choose(type){service=type;cart=[];log(type==='shop'?'おもひで商店を選択':type==='kitchen'?'Aozora kitchenを選択':'FEBBRAIOを選択');if(type==='studio'){waitStart();setScreen(`<div class="spinner"></div><h1>ご利用内容を確認しています</h1>`);await sleep(700);waitEnd();cart=[['STN01','スタジオ利用 1時間',5500,1]];review();return}catalog()}
function catalog(){const list=products[service];setScreen(`<span class="eyebrow">STEP 3</span><h1>${service==='shop'?'商品をスキャン・選択してください':'メニューを選んでください'}</h1><p>商品画像をタップすると追加されます。</p><div class="products">${list.map((p,i)=>`<button class="button product" onclick="add(${i})"><strong>${p[1]}</strong><span>${yen(p[2])}</span><small>タップして追加</small></button>`).join('')}</div><div class="total" id="cartTotal">0点・￥0</div><div class="stack"><button class="button primary" id="confirm" disabled onclick="confirmCart()">内容を確認する</button></div>`)}
function add(i){const p=products[service][i],found=cart.find(x=>x[0]===p[0]);found?found[3]++:cart.push([...p,1]);const count=cart.reduce((s,x)=>s+x[3],0),sum=cart.reduce((s,x)=>s+x[2]*x[3],0);q('cartTotal').textContent=`${count}点・${yen(sum)}`;q('confirm').disabled=false}
function confirmCart(){const count=cart.reduce((s,x)=>s+x[3],0);productReadyAt=performance.now()+count*val('itemDelay');log(`${count}点の商品登録を裏で開始`);review()}
function review(){const count=cart.reduce((s,x)=>s+x[3],0),sum=cart.reduce((s,x)=>s+x[2]*x[3],0);setScreen(`<span class="eyebrow">内容確認</span><h1>${service==='kitchen'?count+'品':service==='studio'?'本日は1時間のご利用':count+'点'}で${yen(sum)}です</h1><p>${service==='kitchen'?'ご注文内容をお確かめください。':'内容をお確かめの上、確認ボタンを押してください。'}</p><div class="review">${cart.map(x=>`<div class="review-row"><span>${x[1]} × ${x[3]}</span><strong>${yen(x[2]*x[3])}</strong></div>`).join('')}</div><button class="button primary" style="width:100%;margin-top:20px" onclick="payment()">${service==='kitchen'?'注文確定':'確認'}</button>`)}
function payment(){log('内容確認完了');setScreen(`<span class="eyebrow">お支払い</span><h1>お支払い方法を選んでください</h1><div class="services"><button class="button service" onclick="pay('現金')"><b>💴</b>現金</button><button class="button service" onclick="pay('クレジットカード')"><b>💳</b>クレジットカード</button><button class="button service" onclick="pay('電子マネー')"><b>◉</b>電子マネー</button></div>`)}
async function pay(kind){log(`${kind}を選択`);waitStart();let remaining=Math.max(0,productReadyAt-performance.now()),duration=Math.max(remaining,val('terminalDelay'));setScreen(`<span class="eyebrow">お支払い準備中</span><h1>決済端末を起動しています</h1><div class="progress"><div class="bar" id="paybar"></div></div><div class="ad"><div><span class="pill">施設の楽しみ方</span><strong>次回はAozora kitchenの<br>モクテルもお試しください</strong><p>好きなベースと割材から選べます</p></div></div>`);animate('paybar',duration);await sleep(duration);log('決済端末起動');setScreen(`<span class="eyebrow">決済確認</span><h1>お支払いを確認しています</h1><p>実機版ではスマレジAPIの売上成立を確認します。</p><div class="progress"><div class="bar" id="salebar"></div></div><div class="ad"><strong>おもひでテラスで<br>新しい楽しみを見つけよう</strong></div>`);animate('salebar',val('saleDelay'));await sleep(val('saleDelay'));waitEnd();log('売上確認完了（シミュレーション）');done()}
function done(){setScreen(`<span class="eyebrow">完了</span><h1>ありがとうございました</h1><p>売上は立っていません。動作速度だけを再現しました。</p><div class="stack"><button class="button primary" onclick="restart()">もう一度試す</button></div>`)}function restart(){clearInterval(elapsedTimer);started=0;totalWait=0;productReadyAt=0;q('elapsed').textContent='0.0秒';q('waited').textContent='0.0秒';q('remaining').textContent='0.0秒';q('timeline').innerHTML='';member()}
function animate(id,duration){const el=q(id);let begin=performance.now();(function frame(){let p=Math.min(92,(performance.now()-begin)/duration*100);if(el)el.style.width=p+'%';if(p<92)requestAnimationFrame(frame)})()}const sleep=ms=>new Promise(r=>setTimeout(r,ms));member();
</script></body></html>
