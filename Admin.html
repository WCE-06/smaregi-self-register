<!doctype html><html lang="ja"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商品・在庫管理</title>
<style>:root{--g:#245a42;--bg:#f4efe4;--p:#fffdf8;--l:#ded7ca;--m:#687169;--r:#a43d30}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#203027;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:1040px;margin:auto;padding:26px 18px 60px}.head{display:flex;align-items:center;gap:13px;margin-bottom:22px}.logo{width:52px;height:52px;border-radius:15px;background:var(--g);color:#fff;display:grid;place-items:center;font-size:25px;font-weight:900}.head h1{margin:0;font-size:26px}.card{background:var(--p);border:1px solid var(--l);border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:0 12px 30px #243c2d12}.row{display:flex;align-items:center;justify-content:space-between;gap:16px}.row h2{margin:0 0 5px}.row p{margin:0;color:var(--m)}.button{display:inline-grid;place-items:center;border:0;border-radius:13px;min-height:50px;padding:12px 18px;background:var(--g);color:#fff;font:inherit;font-weight:900;text-decoration:none;cursor:pointer}.button.secondary{background:#fff;color:var(--g);border:1px solid var(--l)}.button:disabled{opacity:.55}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.metric{padding:15px;background:#f3eee4;border-radius:13px}.metric span{display:block;color:var(--m);font-size:13px;font-weight:800}.metric strong{display:block;margin-top:5px;font-size:22px}.detail,.notice{margin-top:15px;padding:14px;border-radius:11px;background:#f2efe8;color:#5d625e;white-space:pre-wrap}.notice{background:#fff6e4;border-left:4px solid #d39738}.form{display:grid;grid-template-columns:2fr 1fr 1fr 2fr auto;gap:10px;align-items:end;margin-top:16px}.form label{font-size:13px;font-weight:800;color:var(--m)}.form input{width:100%;margin-top:5px;padding:11px;border:1px solid var(--l);border-radius:9px;font:inherit}.lots{display:grid;gap:8px;margin-top:16px}.lot{display:grid;grid-template-columns:minmax(180px,1fr) 90px 120px;gap:10px;padding:12px;border:1px solid var(--l);border-radius:11px;background:#fff}.lot small{display:block;color:var(--m)}#inventoryMessage{min-height:22px;margin-top:8px;color:var(--m)}@media(max-width:760px){.row{align-items:flex-start;flex-direction:column}.metrics{grid-template-columns:1fr}.form{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}.lot{grid-template-columns:1fr 70px}}</style></head>
<body><main class="wrap"><header class="head"><div class="logo">お</div><h1>商品・在庫管理</h1></header>
<section class="card"><div class="row"><div><h2>スマレジ商品マスター</h2><p>15分ごとの自動同期と手動同期を管理します。</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="button secondary" id="openSheetButton">商品管理シートを開く</button><button class="button" id="syncButton">今すぐ同期</button></div></div><div class="metrics"><div class="metric"><span>保存商品数</span><strong id="storedCount">—</strong></div><div class="metric"><span>除外商品数</span><strong id="excludedCount">—</strong></div><div class="metric"><span>最終同期</span><strong id="lastSync">—</strong></div></div><div class="detail" id="syncMessage">同期状態を確認しています。</div></section>
<section class="card"><div class="row"><div><h2>Aozora kitchen メニュー管理</h2><p>検索、追加、並べ替え、オプション設定は専用画面で行います。</p></div><a class="button" target="_top" href="<?!= ScriptApp.getService().getUrl() ?>?page=menu-admin&amp;adminToken=<?!= encodeURIComponent(adminToken) ?>">メニュー編集を開く</a></div><div class="notice">顧客画面と同じ商品カードを見ながら、＋で追加し、ドラッグで表示順を変更できます。</div></section>
<section class="card"><div class="row"><div><h2>入荷・賞味期限管理</h2><p>品出し時に入荷数と賞味期限を登録します。</p></div><button class="button secondary" id="reloadInventory">再読み込み</button></div><form class="form" id="inventoryForm"><label class="wide">商品<input id="inventoryProduct" list="productList" placeholder="商品コードまたは商品名" required><datalist id="productList"></datalist></label><label>入荷数<input id="quantity" type="number" min="1" value="1" required></label><label>賞味期限<input id="expiry" type="date"></label><label class="wide">メモ<input id="note" maxlength="200"></label><button class="button" id="saveReceipt">入荷登録</button></form><div id="inventoryMessage"></div><div class="lots" id="lots"><div class="detail">在庫情報を読み込んでいます。</div></div></section></main>
<script>const ADMIN_TOKEN=<?!= JSON.stringify(adminToken) ?>;const el=id=>document.getElementById(id);let products=[];function call(name,arg){return new Promise((ok,ng)=>{const r=google.script.run.withSuccessHandler(ok).withFailureHandler(e=>ng(new Error(e&&e.message||e)));if(name==='status')r.getProductSyncStatus(ADMIN_TOKEN);if(name==='sync')r.runProductSync(ADMIN_TOKEN);if(name==='sheet')r.getManagementSpreadsheetUrl(ADMIN_TOKEN);if(name==='inventory')r.getInventoryManagementData(ADMIN_TOKEN);if(name==='receipt')r.addInventoryReceipt(arg,ADMIN_TOKEN)})}function h(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function status(){try{const x=await call('status'),s=x.status||{};el('storedCount').textContent=(x.storedCount||0)+'件';el('excludedCount').textContent=(s.excludedCount||0)+'件';el('lastSync').textContent=s.completedAt?new Date(s.completedAt).toLocaleString('ja-JP'):'—';el('syncMessage').textContent=(s.message||'まだ同期されていません')+'\n自動同期: '+(x.triggerInstalled?'設定済み':'未設定')}catch(e){el('syncMessage').textContent='確認エラー: '+e.message}}async function inventory(){try{const x=await call('inventory');products=x.products||[];el('productList').innerHTML=products.map(p=>'<option value="'+h(p.code)+'">'+h(p.name)+'</option>').join('');const lots=x.lots||[];el('lots').innerHTML=lots.length?lots.map(l=>'<div class="lot"><div><strong>'+h(l.productName)+'</strong><small>'+h(l.productCode)+'</small></div><b>'+l.remainingQuantity+'点</b><div>期限<br><strong>'+h(l.expiryDate||'未設定')+'</strong></div></div>').join(''):'<div class="detail">入荷登録はまだありません。</div>'}catch(e){el('lots').innerHTML='<div class="detail">読込エラー: '+h(e.message)+'</div>'}}el('openSheetButton').onclick=async()=>{el('openSheetButton').disabled=true;try{const x=await call('sheet');window.open(x.url,'_blank')}catch(e){el('syncMessage').textContent='商品管理シートを開けませんでした: '+e.message}finally{el('openSheetButton').disabled=false}};el('syncButton').onclick=async()=>{el('syncButton').disabled=true;el('syncMessage').textContent='同期しています…';try{await call('sync');await status()}catch(e){el('syncMessage').textContent='同期エラー: '+e.message}finally{el('syncButton').disabled=false}};el('reloadInventory').onclick=inventory;el('inventoryForm').onsubmit=async e=>{e.preventDefault();const raw=el('inventoryProduct').value.trim(),p=products.find(x=>x.code===raw||x.name===raw);if(!p){el('inventoryMessage').textContent='候補から商品を選択してください';return}el('saveReceipt').disabled=true;try{await call('receipt',{productCode:p.code,quantity:Number(el('quantity').value),expiryDate:el('expiry').value,note:el('note').value});el('inventoryMessage').textContent='入荷を登録しました';el('quantity').value='1';el('note').value='';await inventory()}catch(x){el('inventoryMessage').textContent='登録エラー: '+x.message}finally{el('saveReceipt').disabled=false}};status();inventory();</script></body></html>
